# Render Blueprint — NestJS API only
# Docs: https://render.com/docs/blueprint-spec
#
# Redis/Key Value: Blueprint oluşturmaz. Mevcut instance'ın
# connection string'ini Dashboard → Environment → REDIS_URL olarak gir.
#
# Deploy: Render Dashboard → New → Blueprint → this repo (main)
# Secrets (SUPABASE_*, REDIS_URL, CORS_ORIGIN) sync: false → ilk deploy'da sorulur.

services:
  - type: web
    name: staj-projesi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
