# Render Blueprint — NestJS API + Next.js (frontend/)
# Docs: https://render.com/docs/blueprint-spec
#
# Web: rootDir=frontend — npm komutları frontend/ içinde çalışır.
# Redis: Blueprint oluşturmaz; API Environment → REDIS_URL manuel.

services:
  - type: web
    name: staj-projesi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: staj-projesi-web
    runtime: node
    plan: free
    region: frankfurt
    # Monorepo: tüm npm/next işlemleri bu klasörde
    rootDir: frontend
    # NODE_ENV=production iken devDeps atlanmasın diye --include=dev
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://staj-projesi-api.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
