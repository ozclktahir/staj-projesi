# Render Blueprint — NestJS API + Next.js frontend
# Docs: https://render.com/docs/blueprint-spec
#
# Redis/Key Value: Blueprint oluşturmaz. Mevcut instance'ın
# connection string'ini API Environment → REDIS_URL olarak gir.
#
# Deploy: Render Dashboard → New → Blueprint → this repo (main)
# Secrets sync: false → ilk deploy'da / Environment'tan girilir.

services:
  - type: web
    name: staj-projesi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Frontend URL hazır olunca örn: https://staj-projesi-web.onrender.com
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: staj-projesi-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://staj-projesi-api.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
